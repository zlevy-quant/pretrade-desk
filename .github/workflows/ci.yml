name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras only; the package itself has no dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check (mypy strict)
        run: mypy pretrade bench
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scenario walkthrough (smoke)
        run: python -m pretrade.scenarios
      - name: Latency benchmark (smoke)
        run: python -m bench.latency 5000
